  <style>
    :root{--bg:#111;--card:#1b1b1d;--card2:#242428;--text:#f7f7f2;--muted:#aaa;--line:#333;--accent:#d7ff58;--bad:#ff6868;color-scheme:dark;font-family:Arial,system-ui,sans-serif}*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;touch-action:manipulation}button,input,select{font:inherit;font-size:16px;max-width:100%}button{border:0;border-radius:10px;min-height:46px;padding:0 14px;background:var(--card2);color:var(--text);font-weight:700}input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#101012;color:var(--text);padding:10px 12px}.primary{background:var(--accent);color:#111}.danger{background:rgba(255,104,104,.16);color:#ffd0d0;border:1px solid rgba(255,104,104,.35)}.ghost{background:#f7f7f2;color:#111}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px;background:rgba(17,17,17,.94);border-bottom:1px solid #222}.top h1{margin:0;font-size:20px}.view{padding:14px;display:grid;gap:12px;max-width:720px;width:100%;margin:auto;overflow-x:hidden}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;gap:8px}.card b{font-size:17px}.muted{color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{font-size:12px;min-height:38px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:20px;overflow-wrap:anywhere}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;background:#111;border-top:1px solid #252525}.bottom button{font-size:12px;min-height:52px;padding:0 4px;background:transparent;color:var(--muted)}.bottom .active{background:var(--card2);color:var(--accent)}dialog{width:min(94vw,560px);border:0;border-radius:14px;background:var(--card);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.7)}.modal{padding:14px;display:grid;gap:12px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{font-size:20px;margin:0}.form{display:grid;gap:12px}.product{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.product small,.product code{color:var(--muted);overflow-wrap:anywhere}.toast{position:fixed;left:12px;right:12px;bottom:82px;background:var(--accent);color:#111;border-radius:10px;padding:12px;font-weight:800;opacity:0;transform:translateY(10px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}.error{background:rgba(255,104,104,.16);border:1px solid rgba(255,104,104,.35);color:#ffd0d0;border-radius:10px;padding:12px}.empty{color:var(--muted);padding:20px;text-align:center}.search{display:grid;gap:8px}.check-list{display:grid;gap:8px}.check-item{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}.check-item input{width:22px;min-height:22px;margin-top:2px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.mini-table{width:100%;min-width:720px;border-collapse:collapse;background:var(--card)}.mini-table th,.mini-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left;font-size:12px}.mini-table th{color:var(--muted)}@media(max-width:390px){.grid2{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}

<body>
<div class="app">
  <header class="top"><h1 id="title">IXSAYZ</h1><button id="refresh">&#1054;&#1073;&#1085;&#1086;&#1074;&#1080;&#1090;&#1100;</button></header>

<dialog id="dlg"><div class="modal"><div class="head"><h2 id="dlgTitle"></h2><button id="close">Г—</button></div><div id="dlgBody"></div></div></dialog>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
const DB='ixsayz-clean-db', VER=2, STORES=['deliveries','suppliers','products','categories'];
const state={tab:'deliveries',deliveryId:'',supplierId:'',labelDeliveryId:'',labelSupplierId:'',reportDeliveryId:'',productDeliveryId:'',productSupplierId:'',productQuery:'',deliveries:[],suppliers:[],products:[],categories:[]};
const $=s=>document.querySelector(s), view=$('#view'), title=$('#title'), dlg=$('#dlg'), dlgTitle=$('#dlgTitle'), dlgBody=$('#dlgBody');
const today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
const R=h=>h.split(' ').map(x=>String.fromCharCode(parseInt(x,16))).join('');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
let dbp;function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function store(n,m='readonly'){return (await db()).transaction(n,m).objectStore(n)}
async function all(n){const s=await store(n);return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function put(n,o){const now=new Date().toISOString();const item={...o,id:o.id||uid(),createdAt:o.createdAt||now,updatedAt:now};const s=await store(n,'readwrite');return new Promise((res,rej)=>{const r=s.put(item);r.onsuccess=()=>res(item.id);r.onerror=()=>rej(r.error)})}
async function del(n,id){const s=await store(n,'readwrite');return new Promise((res,rej)=>{const r=s.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function load(){try{[state.deliveries,state.suppliers,state.products,state.categories]=await Promise.all([all('deliveries'),all('suppliers'),all('products'),all('categories')]);render()}catch(e){view.innerHTML='<div class="error">Локальная база не открылась. РќРµ РёСЃРїРѕР»СЊР·СѓР№ РїСЂРёРІР°С‚РЅС‹Р№ режим браузера.</div>';console.error(e)}}
const dp=id=>state.products.filter(p=>p.deliveryId===id), sp=id=>state.products.filter(p=>p.supplierId===id), ds=id=>state.suppliers.filter(s=>s.deliveryId===id);
function categoryNames(){const set=new Set([R('041a 0440 043e 0441 0441 043e 0432 043a 0438'),R('041e 0434 0435 0436 0434 0430'),R('041e 0431 0443 0432 044c'),...state.categories.map(c=>c.name),...state.products.map(p=>p.cat)].filter(Boolean));return [...set].sort((a,b)=>a.localeCompare(b,'ru'))}
function totals(arr){return arr.reduce((a,p)=>{const q=+p.qty||0,b=(+p.buy||0)*q,s=(+p.sale||0)*q;a.models++;a.qty+=q;a.buy+=b;a.sale+=s;a.profit+=s-b;return a},{models:0,qty:0,buy:0,sale:0,profit:0})}
function stats(arr){const t=totals(arr);return `<div class="metrics"><div class="metric"><span>${R('041c 043e 0434 0435 043b 0435 0439')}</span><b>${t.models}</b></div><div class="metric"><span>${R('0415 0434 0438 043d 0438 0446')}</span><b>${t.qty}</b></div><div class="metric"><span>${R('0417 0430 043a 0443 043f 043a 0430')}</span><b>${money(t.buy)}</b></div><div class="metric"><span>${R('041f 0440 043e 0434 0430 0436 0430')}</span><b>${money(t.sale)}</b></div></div>`}
function setTab(t,o={}){state.tab=t;if(o.deliveryId!==undefined)state.deliveryId=o.deliveryId;if(o.supplierId!==undefined)state.supplierId=o.supplierId;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function open(t,h){dlgTitle.textContent=t;dlgBody.innerHTML=h;dlg.showModal()}function close(){dlg.close()}
function render(){const names={deliveries:R('0417 0430 0432 043e 0437 044b'),delivery:R('0417 0430 0432 043e 0437'),supplier:R('041f 043e 0441 0442 0430 0432 0449 0438 043a'),products:R('0422 043e 0432 0430 0440 044b'),labels:R('041f 0435 0447 0430 0442 044c'),report:R('041e 0442 0447 0435 0442'),export:R('042d 043a 0441 043f 043e 0440 0442')};title.textContent=names[state.tab]||'IXSAYZ';({deliveries,delivery,supplier,products,labels,report,export:exportView}[state.tab]||deliveries)()}
function deliveries(){const cards=state.deliveries.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(d=>{const t=totals(dp(d.id));return '<div class="card"><b>'+esc(d.name)+'</b><span class="muted">'+esc(d.date)+' ? '+ds(d.id).length+' '+R('043f 043e 0441 0442 0430 0432 0449 0438 043a 043e 0432')+' ? '+t.models+' '+R('043c 043e 0434 0435 043b 0435 0439')+' ? '+t.qty+' '+R('0448 0442')+'</span><span>'+money(t.buy)+' ? '+money(t.sale)+' ? '+R('043f 0440 0438 0431 044b 043b 044c')+' '+money(t.profit)+'</span><div class="actions"><button data-act="openDelivery" data-id="'+d.id+'">'+R('041e 0442 043a 0440 044b 0442 044c')+'</button><button data-act="editDelivery" data-id="'+d.id+'">'+R('0418 0437 043c 002e')+'</button><button class="danger" data-act="delDelivery" data-id="'+d.id+'">'+R('0423 0434 0430 043b 002e')+'</button></div></div>'}).join('')||'<div class="empty">'+R('0421 043e 0437 0434 0430 0439 0020 043f 0435 0440 0432 044b 0439 0020 0437 0430 0432 043e 0437')+'</div>';view.innerHTML=stats(state.products)+'<button class="primary" data-act="newDelivery">'+R('0421 043e 0437 0434 0430 0442 044c 0020 0437 0430 0432 043e 0437')+'</button>'+cards}
function delivery(){const d=state.deliveries.find(x=>x.id===state.deliveryId);if(!d)return deliveries();view.innerHTML=`<button data-tab="deliveries">? ${R('041d 0430 0437 0430 0434')}</button><div class="card"><b>${esc(d.name)}</b><span class="muted">${esc(d.date)}</span></div>${stats(dp(d.id))}<button class="primary" data-act="newSupplier">${R('0414 043e 0431 0430 0432 0438 0442 044c 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a 0430')}</button>${ds(d.id).map(s=>{const t=totals(sp(s.id));return `<div class="card"><b>${esc(s.name)}</b><span class="muted">${t.models} ${R('041c 043e 0434 0435 043b 0435 0439')} ? ${t.qty} ${R('0415 0434 0438 043d 0438 0446')}</span><div class="actions"><button data-act="openSupplier" data-id="${s.id}">${R('041e 0442 043a 0440 044b 0442 044c')}</button><button data-act="editSupplier" data-id="${s.id}">${R('0418 043c 044f')}</button><button class="danger" data-act="delSupplier" data-id="${s.id}">${R('0423 0434 0430 043b 002e')}</button></div></div>`}).join('')||'<div class="empty">'+R('0414 043e 0431 0430 0432 044c 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a 0430')+'</div>'}`}
function supplier(){const s=state.suppliers.find(x=>x.id===state.supplierId);if(!s)return delivery();view.innerHTML=`<button data-tab="delivery">? ${R('041d 0430 0437 0430 0434')}</button><div class="card"><b>${esc(s.name)}</b></div>${stats(sp(s.id))}<button class="primary" data-act="newProduct">${R('0414 043e 0431 0430 0432 0438 0442 044c 0020 0442 043e 0432 0430 0440')}</button>${sp(s.id).map(p=>`<div class="product"><div><b>${esc(p.name)}</b><small>${esc(p.cat)} ? ${esc(p.gender)} ? ${esc(p.size)}</small><br><code>${esc(p.barcode)}</code></div><div><b>${money(p.sale)}</b><br><small>${p.qty} ${R('0448 0442')}</small></div><div class="line-actions"><button data-act="editProduct" data-id="${p.id}">${R('0418 0437 043c 002e')}</button><button class="danger" data-act="delProduct" data-id="${p.id}">${R('0423 0434 0430 043b 002e')}</button></div></div>`).join('')||'<div class="empty">'+R('0414 043e 0431 0430 0432 044c 0020 0442 043e 0432 0430 0440')+'</div>'}`}
function products(){const deliveryOptions=state.deliveries.map(d=>`<option value="${d.id}" ${state.productDeliveryId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');const supplierSource=state.productDeliveryId?state.suppliers.filter(s=>s.deliveryId===state.productDeliveryId):state.suppliers;const supplierOptions=supplierSource.map(s=>`<option value="${s.id}" ${state.productSupplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');const arr=filteredProducts();view.innerHTML=`${stats(arr)}<div class="search"><input id="q" placeholder="${R('041f 043e 0438 0441 043a 0020 0442 043e 0432 0430 0440 0430 0020 0438 043b 0438 0020 0448 0442 0440 0438 0445 043a 043e 0434 0430')}" value="${esc(state.productQuery)}"><div class="grid2"><label>${R('0417 0430 0432 043e 0437')}<select id="productDelivery"><option value="">${R('0412 0441 0435 0020 0437 0430 0432 043e 0437 044b')}</option>${deliveryOptions}</select></label><label>${R('041f 043e 0441 0442 0430 0432 0449 0438 043a')}<select id="productSupplier"><option value="">${R('0412 0441 0435 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a 0438')}</option>${supplierOptions}</select></label></div></div><div id="plist">${productList(arr)}</div>`}
function filteredProducts(){const q=state.productQuery.toLowerCase();return state.products.filter(p=>(!state.productDeliveryId||p.deliveryId===state.productDeliveryId)&&(!state.productSupplierId||p.supplierId===state.productSupplierId)&&(!q||(p.name+' '+p.barcode+' '+p.supplierName+' '+p.deliveryName+' '+p.size+' '+p.cat).toLowerCase().includes(q)))}
function productList(arr){return arr.map(p=>`<div class="card"><b>${esc(p.name)}</b><span class="muted">${esc(p.supplierName)} ? ${esc(p.deliveryName)}</span><span>${p.qty} ${R('0448 0442')} ? ${money(p.sale)}</span><code>${esc(p.barcode)}</code></div>`).join('')||'<div class="empty">'+R('041d 0435 0442 0020 0442 043e 0432 0430 0440 043e 0432')+'</div>'}
function labels(){const deliveries=state.deliveries.map(d=>`<option value="${d.id}" ${state.labelDeliveryId===d.id?'selected':''}>${esc(d.name)}</option>`).join('');const supplierSource=state.labelDeliveryId?state.suppliers.filter(s=>s.deliveryId===state.labelDeliveryId):state.suppliers;const suppliers=supplierSource.map(s=>`<option value="${s.id}" ${state.labelSupplierId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');const arr=labelProducts();const items=arr.map(p=>`<label class="check-item"><input type="checkbox" class="label-pick" value="${p.id}"><span><b>${esc(p.name)}</b><br><small>${esc(p.supplierName)} ? ${esc(p.deliveryName)} ? ${esc(p.size)} ? ${p.labelQty||p.qty} ${R('0446 0435 043d 002e')}</small><br><code>${esc(p.barcode)}</code></span></label>`).join('')||`<div class="empty">${R('041d 0435 0442 0020 0442 043e 0432 0430 0440 043e 0432 0020 0434 043b 044f 0020 043f 0435 0447 0430 0442 0438')}</div>`;view.innerHTML=`${stats(arr)}<div class="grid2"><label>${R('0417 0430 0432 043e 0437')}<select id="labelDelivery"><option value="">${R('0412 0441 0435 0020 0437 0430 0432 043e 0437 044b')}</option>${deliveries}</select></label><label>${R('041f 043e 0441 0442 0430 0432 0449 0438 043a')}<select id="labelSupplier"><option value="">${R('0412 0441 0435 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a 0438')}</option>${suppliers}</select></label></div><button class="primary" data-act="printLabels">${R('041f 0435 0447 0430 0442 0430 0442 044c 0020 0432 044b 0431 0440 0430 043d 043d 043e 0435')}</button><div class="check-list">${items}</div>`}
function report(){const deliveries=state.deliveries.map(d=>`<option value="${d.id}" ${state.reportDeliveryId===d.id?'selected':''}>${esc(d.name)} ? ${esc(d.date)}</option>`).join('');const arr=reportProducts();const supplierRows=reportSuppliers(arr);view.innerHTML=`<label>${R('0417 0430 0432 043e 0437 0020 0434 043b 044f 0020 043e 0442 0447 0435 0442 0430')}<select id="reportDelivery"><option value="">${R('041e 0431 0449 0438 0439 0020 043e 0442 0447 0435 0442')}</option>${deliveries}</select></label>${stats(arr)}<button class="primary" data-act="printReport">${R('041f 0435 0447 0430 0442 0430 0442 044c 0020 043e 0442 0447 0435 0442')}</button><div class="table-wrap"><table class="mini-table"><thead><tr><th>${R('041f 043e 0441 0442 0430 0432 0449 0438 043a')}</th><th>${R('043c 043e 0434 0435 043b 0435 0439')}</th><th>${R('0415 0434 0438 043d 0438 0446')}</th><th>${R('0417 0430 043a 0443 043f 043a 0430')}</th><th>${R('041f 0440 043e 0434 0430 0436 0430')}</th><th>${R('043f 0440 0438 0431 044b 043b 044c')}</th></tr></thead><tbody>${supplierRows}</tbody></table></div>`}
function labelProducts(){return state.products.filter(p=>(!state.labelDeliveryId||p.deliveryId===state.labelDeliveryId)&&(!state.labelSupplierId||p.supplierId===state.labelSupplierId))}
function reportProducts(){return state.reportDeliveryId?state.products.filter(p=>p.deliveryId===state.reportDeliveryId):state.products}
function reportSuppliers(arr){const map={};arr.forEach(p=>{(map[p.supplierId]||(map[p.supplierId]={name:p.supplierName,items:[]})).items.push(p)});return Object.values(map).map(g=>{const t=totals(g.items);return `<tr><td>${esc(g.name)}</td><td>${t.models}</td><td>${t.qty}</td><td>${money(t.buy)}</td><td>${money(t.sale)}</td><td>${money(t.profit)}</td></tr>`}).join('')||`<tr><td colspan="6">${R('041d 0435 0442 0020 0442 043e 0432 0430 0440 043e 0432')}</td></tr>`}
function exportView(){view.innerHTML=`<button class="primary" data-act="csv">${R('0421 043a 0430 0447 0430 0442 044c 0020 0043 0053 0056')}</button><div class="empty">${R('0043 0053 0056 0020 043e 0442 043a 0440 044b 0432 0430 0435 0442 0441 044f 0020 0432 0020 0045 0078 0063 0065 006c 002e')}</div>`}
function deliveryForm(d={}){open(d.id?R('0418 0437 043c 0435 043d 0438 0442 044c 0020 0437 0430 0432 043e 0437'):R('041d 043e 0432 044b 0439 0020 0437 0430 0432 043e 0437'),`<form id="fDelivery" class="form"><label>${R('041d 0430 0437 0432 0430 043d 0438 0435 0020 0437 0430 0432 043e 0437 0430')}<input name="name" required value="${esc(d.name||R('0417 0430 0432 043e 0437')+' '+(state.deliveries.length+1))}"></label><label>${R('0414 0430 0442 0430')}<input name="date" type="date" value="${esc(d.date||today())}"></label><button class="primary">${R('0421 043e 0445 0440 0430 043d 0438 0442 044c')}</button></form>`)}
function supplierForm(s={}){open(s.id?R('0418 043c 044f 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a 0430'):R('041d 043e 0432 044b 0439 0020 043f 043e 0441 0442 0430 0432 0449 0438 043a'),`<form id="fSupplier" class="form"><label>${R('041f 043e 0441 0442 0430 0432 0449 0438 043a')}<input name="name" required value="${esc(s.name||'')}"></label><button class="primary">${R('0421 043e 0445 0440 0430 043d 0438 0442 044c')}</button></form>`)}

e" value="${esc(p.barcode||'')}"></label></div><button class="primary" type="submit">${R('0421 043e 0445 0440 0430 043d 0438 0442 044c')}</button></form>`)}
function checksum(b){const a=String(b).padStart(12,'0').slice(0,12).split('').map(Number),s=a.reduce((x,n,i)=>x+n*(i%2?3:1),0);return String((10-s%10)%10)}function valid(c){c=String(c||'').replace(/\D/g,'');return /^\d{13}$/.test(c)&&checksum(c.slice(0,12))===c[12]}function newBarcode(){let c;do{const b='29'+Math.floor(Math.random()*1e10).toString().padStart(10,'0');c=b+checksum(b)}while(state.products.some(p=>p.barcode===c));return c}
async function saveDelivery(form){const fd=Object.fromEntries(new FormData(form));const cur=state.deliveries.find(x=>x.id===form.dataset.id)||{};const newId=await put('deliveries',{...cur,name:fd.name,date:fd.date});close();toast('Завоз сохранен');await load();setTab('delivery',{deliveryId:newId})}
async function saveSupplier(form){const fd=Object.fromEntries(new FormData(form));const cur=state.suppliers.find(x=>x.id===form.dataset.id)||{};const newId=await put('suppliers',{...cur,name:fd.name,deliveryId:cur.deliveryId||state.deliveryId});close();toast('Поставщик сохранен');await load();setTab('supplier',{supplierId:newId})}
async function saveProduct(form){const fd=Object.fromEntries(new FormData(form));const cur=state.products.find(x=>x.id===form.dataset.id)||{},s=state.suppliers.find(x=>x.id===state.supplierId),d=state.deliveries.find(x=>x.id===state.deliveryId);const cat=(fd.newCat||fd.cat||'').trim();if(fd.newCat&&cat&&!state.categories.some(c=>String(c.name).toLowerCase()===cat.toLowerCase()))await put('categories',{name:cat});let barcode=fd.barcode||cur.barcode||newBarcode();if(!valid(barcode))throw Error(R('0428 0442 0440 0438 0445 043a 043e 0434 0020 0434 043e 043b 0436 0435 043d 0020 0431 044b 0442 044c 0020 0045 0041 004e 002d 0031 0033'));await put('products',{...cur,name:fd.name,cat,gender:fd.gender,size:fd.size,qty:+fd.qty,buy:+fd.buy,sale:+fd.sale,labelQty:+fd.labelQty,barcode,supplierId:s.id,supplierName:s.name,deliveryId:d.id,deliveryName:d.name});close();toast(R('0422 043e 0432 0430 0440 0020 0441 043e 0445 0440 0430 043d 0435 043d'));await load();setTab('supplier',{supplierId:s.id})}
function csv(){const rows=[['Название','Категория','Закупка','Продажа','Штрихкод','Остаток','Размер','Пол','Поставщик','Завоз'],...state.products.map(p=>[p.name,p.cat,p.buy,p.sale,'="'+p.barcode+'"',p.qty,p.size,p.gender,p.supplierName,p.deliveryName])];download(new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),'ixsayz.csv')}

function printLabels(){const picked=[...document.querySelectorAll('.label-pick:checked')].map(x=>x.value);const arr=picked.length?state.products.filter(p=>picked.includes(p.id)):labelProducts();if(!arr.length)return toast(R('041d 0435 0442 0020 0442 043e 0432 0430 0440 043e 0432 0020 0434 043b 044f 0020 043f 0435 0447 0430 0442 0438'));const html=`<html><head><style>@page{size:43mm 25mm;margin:0}body{margin:0;font-family:Arial}.label{width:43mm;height:25mm;page-break-after:always;padding:2mm;box-sizing:border-box}b{font-size:8pt}.price{font-size:12pt;font-weight:bold}.code{text-align:center;font-size:8pt;margin-top:4mm}</style></head><body>${arr.flatMap(p=>Array.from({length:+p.labelQty||+p.qty||1},()=>`<div class="label"><b>${esc(p.name)}</b><div class="price">${p.sale} ?</div><div>${R('0420 0430 0437 043c 0435 0440')}: ${esc(p.size)}</div><div class="code">${p.barcode}</div></div>`)).join('')}</body></html>`;printWin(html)}
function printReport(){const arr=reportProducts();if(!arr.length)return toast(R('041d 0435 0442 0020 0442 043e 0432 0430 0440 043e 0432 0020 0434 043b 044f 0020 043e 0442 0447 0435 0442 0430'));const d=state.deliveries.find(x=>x.id===state.reportDeliveryId);const title=d?`${R('041e 0442 0447 0435 0442 0020 043f 043e 0020 0437 0430 0432 043e 0437 0443')}: ${esc(d.name)} ? ${esc(d.date)}`:R('041e 0431 0449 0438 0439 0020 043e 0442 0447 0435 0442');const rows=arr.map((p,i)=>{const q=+p.qty||0,b=(+p.buy||0)*q,s=(+p.sale||0)*q;return `<tr><td>${i+1}</td><td>${esc(p.supplierName)}</td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${esc(p.size)}</td><td>${q}</td><td>${money(p.buy)}</td><td>${money(p.sale)}</td><td>${money(b)}</td><td>${money(s)}</td><td>${money(s-b)}</td></tr>`}).join('');const t=totals(arr);const html=`<html><head><style>body{font-family:Arial;margin:18px;color:#111}h1{font-size:22px;margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #ddd;padding:6px;text-align:left}th{background:#eee}.total{margin-top:12px;font-weight:bold}</style></head><body><h1>IXSAYZ Inventory</h1><h2>${title}</h2><table><thead><tr><th>?</th><th>${R('041f 043e 0441 0442 0430 0432 0449 0438 043a')}</th><th>${R('0422 043e 0432 0430 0440')}</th><th>${R('041a 0430 0442 0435 0433 043e 0440 0438 044f')}</th><th>${R('0420 0430 0437 043c 0435 0440')}</th><th>${R('041a 043e 043b 002d 0432 043e')}</th><th>${R('0417 0430 043a 0443 043f 043a 0430')}</th><th>${R('041f 0440 043e 0434 0430 0436 0430')}</th><th>${R('0417 0430 043a 0443 043f 043a 0430')}</th><th>${R('041f 0440 043e 0434 0430 0436 0430')}</th><th>${R('043f 0440 0438 0431 044b 043b 044c')}</th></tr></thead><tbody>${rows}</tbody></table><div class="total">${R('0418 0442 043e 0433 043e')}: ${t.qty} ${R('0448 0442')} ? ${R('0417 0430 043a 0443 043f 043a 0430')} ${money(t.buy)} ? ${R('041f 0440 043e 0434 0430 0436 0430')} ${money(t.sale)} ? ${R('043f 0440 0438 0431 044b 043b 044c')} ${money(t. document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)return setTab(b.dataset.tab);try{const a=b.dataset.act,i=b.dataset.id;if(a==='newDelivery')deliveryForm();if(a==='openDelivery')setTab('delivery',{deliveryId:i});if(a==='editDelivery'){const d=state.deliveries.find(x=>x.id===i);deliveryForm(d);setTimeout(()=>$('#fDelivery').dataset.id=i)}if(a==='delDelivery'&&confirm('Удалить завоз?')){for(const p of dp(i))await del('products',p.id);for(const s of ds(i))await del('suppliers',s.id);await del('deliveries',i);await load()}if(a==='newSupplier')supplierForm();if(a==='openSupplier')setTab('supplier',{supplierId:i});if(a==='editSupplier'){const s=state.suppliers.find(x=>x.id===i);supplierForm(s);setTimeout(()=>$('#fSupplier').dataset.id=i)}if(a==='delSupplier'&&confirm('Удалить поставщика?')){for(const p of sp(i))await del('products',p.id);await del('suppliers',i);await load()}if(a==='newProduct')productForm();if(a==='editProduct'){const p=state.products.find(x=>x.id===i);productForm(p);setTimeout(()=>$('#fProduct').dataset.id=i)}if(a==='delProduct'&&confirm('Удалить товар?')){await del('products',i);await load()}if(a==='csv')csv();if(a==='printLabels')printLabels();if(a==='printReport')printReport()}catch(err){toast(err.message);console.error(err)}});
