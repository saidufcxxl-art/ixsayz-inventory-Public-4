<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IXSAYZ">
  <title>IXSAYZ Inventory</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <style>
    :root{--bg:#111;--card:#1b1b1d;--card2:#242428;--text:#f7f7f2;--muted:#aaa;--line:#333;--accent:#d7ff58;--bad:#ff6868;color-scheme:dark;font-family:Arial,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{border:0;border-radius:10px;min-height:46px;padding:0 14px;background:var(--card2);color:var(--text);font-weight:700}input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#101012;color:var(--text);padding:10px 12px}.primary{background:var(--accent);color:#111}.danger{background:rgba(255,104,104,.16);color:#ffd0d0;border:1px solid rgba(255,104,104,.35)}.ghost{background:#f7f7f2;color:#111}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px;background:rgba(17,17,17,.94);border-bottom:1px solid #222}.top h1{margin:0;font-size:20px}.view{padding:14px;display:grid;gap:12px;max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;gap:8px}.card b{font-size:17px}.muted{color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{font-size:12px;min-height:38px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:20px;overflow-wrap:anywhere}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;background:#111;border-top:1px solid #252525}.bottom button{font-size:12px;min-height:52px;padding:0 4px;background:transparent;color:var(--muted)}.bottom .active{background:var(--card2);color:var(--accent)}dialog{width:min(94vw,560px);border:0;border-radius:14px;background:var(--card);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.7)}.modal{padding:14px;display:grid;gap:12px}.head{display:flex;align-items:center;justify-content:space-between}.head h2{font-size:20px;margin:0}.form{display:grid;gap:12px}.product{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.product small,.product code{color:var(--muted);overflow-wrap:anywhere}.toast{position:fixed;left:12px;right:12px;bottom:82px;background:var(--accent);color:#111;border-radius:10px;padding:12px;font-weight:800;opacity:0;transform:translateY(10px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}.error{background:rgba(255,104,104,.16);border:1px solid rgba(255,104,104,.35);color:#ffd0d0;border-radius:10px;padding:12px}.empty{color:var(--muted);padding:20px;text-align:center}.search{display:grid;gap:8px}@media(max-width:390px){.grid2{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="title">IXSAYZ</h1><button id="refresh">Обновить</button></header>
  <main id="view" class="view"></main>
  <nav class="bottom">
    <button data-tab="deliveries" class="active">Завозы</button><button data-tab="products">Товары</button><button data-tab="labels">Печать</button><button data-tab="report">Отчет</button><button data-tab="export">Экспорт</button>
  </nav>
</div>
<dialog id="dlg"><div class="modal"><div class="head"><h2 id="dlgTitle"></h2><button id="close">×</button></div><div id="dlgBody"></div></div></dialog>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
const DB='ixsayz-clean-db', VER=1, STORES=['deliveries','suppliers','products'];
const state={tab:'deliveries',deliveryId:'',supplierId:'',deliveries:[],suppliers:[],products:[]};
const $=s=>document.querySelector(s), view=$('#view'), title=$('#title'), dlg=$('#dlg'), dlgTitle=$('#dlgTitle'), dlgBody=$('#dlgBody');
const today=()=>new Date().toISOString().slice(0,10), uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
const money=v=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(v||0));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
let dbp;function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function store(n,m='readonly'){return (await db()).transaction(n,m).objectStore(n)}
async function all(n){const s=await store(n);return new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function put(n,o){const now=new Date().toISOString();const item={...o,id:o.id||uid(),createdAt:o.createdAt||now,updatedAt:now};const s=await store(n,'readwrite');return new Promise((res,rej)=>{const r=s.put(item);r.onsuccess=()=>res(item.id);r.onerror=()=>rej(r.error)})}
async function del(n,id){const s=await store(n,'readwrite');return new Promise((res,rej)=>{const r=s.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function load(){try{[state.deliveries,state.suppliers,state.products]=await Promise.all([all('deliveries'),all('suppliers'),all('products')]);render()}catch(e){view.innerHTML='<div class="error">Локальная база не открылась. Не используй приватный режим браузера.</div>';console.error(e)}}
const dp=id=>state.products.filter(p=>p.deliveryId===id), sp=id=>state.products.filter(p=>p.supplierId===id), ds=id=>state.suppliers.filter(s=>s.deliveryId===id);
function totals(arr){return arr.reduce((a,p)=>{const q=+p.qty||0,b=(+p.buy||0)*q,s=(+p.sale||0)*q;a.models++;a.qty+=q;a.buy+=b;a.sale+=s;a.profit+=s-b;return a},{models:0,qty:0,buy:0,sale:0,profit:0})}
function stats(arr){const t=totals(arr);return `<div class="metrics"><div class="metric"><span>Моделей</span><b>${t.models}</b></div><div class="metric"><span>Единиц</span><b>${t.qty}</b></div><div class="metric"><span>Закупка</span><b>${money(t.buy)}</b></div><div class="metric"><span>Продажа</span><b>${money(t.sale)}</b></div></div>`}
function setTab(t,o={}){state.tab=t;if(o.deliveryId!==undefined)state.deliveryId=o.deliveryId;if(o.supplierId!==undefined)state.supplierId=o.supplierId;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function open(t,h){dlgTitle.textContent=t;dlgBody.innerHTML=h;dlg.showModal()}function close(){dlg.close()}
function render(){const names={deliveries:'Завозы',delivery:'Завоз',supplier:'Поставщик',products:'Товары',labels:'Печать',report:'Отчет',export:'Экспорт'};title.textContent=names[state.tab]||'IXSAYZ';({deliveries,delivery,supplier,products,labels,report,export:exportView}[state.tab]||deliveries)()}
function deliveries(){view.innerHTML=`<button class="primary" data-act="newDelivery">Создать завоз</button>${state.deliveries.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(d=>{const t=totals(dp(d.id));return `<div class="card"><b>${esc(d.name)}</b><span class="muted">${esc(d.date)} · ${ds(d.id).length} поставщиков · ${t.models} моделей</span><span>${money(t.buy)} → ${money(t.sale)}</span><div class="actions"><button data-act="openDelivery" data-id="${d.id}">Открыть</button><button data-act="editDelivery" data-id="${d.id}">Изм.</button><button class="danger" data-act="delDelivery" data-id="${d.id}">Удал.</button></div></div>`}).join('')||'<div class="empty">Создай первый завоз</div>'}`}
function delivery(){const d=state.deliveries.find(x=>x.id===state.deliveryId);if(!d)return deliveries();view.innerHTML=`<button data-tab="deliveries">← Назад</button><div class="card"><b>${esc(d.name)}</b><span class="muted">${esc(d.date)}</span></div>${stats(dp(d.id))}<button class="primary" data-act="newSupplier">Добавить поставщика</button>${ds(d.id).map(s=>{const t=totals(sp(s.id));return `<div class="card"><b>${esc(s.name)}</b><span class="muted">${t.models} моделей · ${t.qty} единиц</span><div class="actions"><button data-act="openSupplier" data-id="${s.id}">Открыть</button><button data-act="editSupplier" data-id="${s.id}">Имя</button><button class="danger" data-act="delSupplier" data-id="${s.id}">Удал.</button></div></div>`}).join('')||'<div class="empty">Добавь поставщика</div>'}`}
function supplier(){const s=state.suppliers.find(x=>x.id===state.supplierId);if(!s)return delivery();view.innerHTML=`<button data-tab="delivery">← Назад</button><div class="card"><b>${esc(s.name)}</b></div>${stats(sp(s.id))}<button class="primary" data-act="newProduct">Добавить товар</button>${sp(s.id).map(p=>`<div class="product"><div><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${esc(p.gender)} · ${esc(p.size)}</small><br><code>${esc(p.barcode)}</code></div><div><b>${money(p.sale)}</b><br><small>${p.qty} шт</small></div><div class="line-actions"><button data-act="editProduct" data-id="${p.id}">Изм.</button><button class="danger" data-act="delProduct" data-id="${p.id}">Удал.</button></div></div>`).join('')||'<div class="empty">Добавь товар</div>'}`}
function products(){view.innerHTML=`<div class="search"><input id="q" placeholder="Поиск товара или штрихкода"></div><div id="plist">${productList(state.products)}</div>`;$('#q').oninput=e=>{$('#plist').innerHTML=productList(state.products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(e.target.value.toLowerCase())))}}
function productList(arr){return arr.map(p=>`<div class="card"><b>${esc(p.name)}</b><span class="muted">${esc(p.supplierName)} · ${esc(p.deliveryName)}</span><span>${p.qty} шт · ${money(p.sale)}</span><code>${esc(p.barcode)}</code></div>`).join('')||'<div class="empty">Нет товаров</div>'}
function labels(){view.innerHTML=`<button class="primary" data-act="printLabels">Печатать ценники</button><div class="empty">Создаст страницу ценников 43×25 мм. В браузере выбери печать или сохранить PDF.</div>`}
function report(){const t=totals(state.products);view.innerHTML=`${stats(state.products)}<button class="primary" data-act="printReport">Печатать отчет</button>`}
function exportView(){view.innerHTML=`<button class="primary" data-act="csv">Скачать CSV</button><div class="empty">CSV открывается в Excel.</div>`}
function deliveryForm(d={}){open(d.id?'Изменить завоз':'Новый завоз',`<form id="fDelivery" class="form"><label>Название завоза<input name="name" value="${esc(d.name||'Завоз '+(state.deliveries.length+1))}"></label><label>Дата<input name="date" type="date" value="${esc(d.date||today())}"></label><button class="primary" type="submit">Сохранить</button></form>`)}
function supplierForm(s={}){open(s.id?'Имя поставщика':'Новый поставщик',`<form id="fSupplier" class="form"><label>Поставщик<input name="name" value="${esc(s.name||'')}"></label><button class="primary" type="submit">Сохранить</button></form>`)}
function productForm(p={}){open(p.id?'Изменить товар':'Новый товар',`<form id="fProduct" class="form"><label>Название / бренд<input name="name" value="${esc(p.name||'')}"></label><div class="grid2"><label>Категория<select name="cat"><option ${p.cat==='Кроссовки'?'selected':''}>Кроссовки</option><option ${p.cat==='Одежда'?'selected':''}>Одежда</option><option ${p.cat==='Обувь'?'selected':''}>Обувь</option></select></label><label>Пол<select name="gender"><option ${p.gender==='Мужской'?'selected':''}>Мужской</option><option ${p.gender==='Женский'?'selected':''}>Женский</option><option ${p.gender==='Унисекс'?'selected':''}>Унисекс</option></select></label></div><div class="grid2"><label>Размер<input name="size" value="${esc(p.size||'')}"></label><label>Кол-во<input name="qty" type="number" min="1" value="${p.qty||1}"></label></div><div class="grid2"><label>Закупка<input name="buy" type="number" min="0" value="${p.buy||0}"></label><label>Продажа<input name="sale" type="number" min="0" value="${p.sale||0}"></label></div><div class="grid2"><label>Ценников<input name="labelQty" type="number" min="1" value="${p.labelQty||p.qty||1}"></label><label>Штрихкод<input name="barcode" value="${esc(p.barcode||'')}"></label></div><button class="primary" type="submit">Сохранить</button></form>`)}
function checksum(b){const a=String(b).padStart(12,'0').slice(0,12).split('').map(Number),s=a.reduce((x,n,i)=>x+n*(i%2?3:1),0);return String((10-s%10)%10)}function valid(c){c=String(c||'').replace(/\D/g,'');return /^\d{13}$/.test(c)&&checksum(c.slice(0,12))===c[12]}function newBarcode(){let c;do{const b='29'+Math.floor(Math.random()*1e10).toString().padStart(10,'0');c=b+checksum(b)}while(state.products.some(p=>p.barcode===c));return c}
async function saveDelivery(form){const fd=Object.fromEntries(new FormData(form));const cur=state.deliveries.find(x=>x.id===form.dataset.id)||{};const newId=await put('deliveries',{...cur,name:fd.name,date:fd.date});close();toast('Завоз сохранен');await load();setTab('delivery',{deliveryId:newId})}
async function saveSupplier(form){const fd=Object.fromEntries(new FormData(form));const cur=state.suppliers.find(x=>x.id===form.dataset.id)||{};const newId=await put('suppliers',{...cur,name:fd.name,deliveryId:cur.deliveryId||state.deliveryId});close();toast('Поставщик сохранен');await load();setTab('supplier',{supplierId:newId})}
async function saveProduct(form){const fd=Object.fromEntries(new FormData(form));const cur=state.products.find(x=>x.id===form.dataset.id)||{},s=state.suppliers.find(x=>x.id===state.supplierId),d=state.deliveries.find(x=>x.id===state.deliveryId);let barcode=fd.barcode||cur.barcode||newBarcode();if(!valid(barcode))throw Error('Штрихкод должен быть EAN-13');await put('products',{...cur,name:fd.name,cat:fd.cat,gender:fd.gender,size:fd.size,qty:+fd.qty,buy:+fd.buy,sale:+fd.sale,labelQty:+fd.labelQty,barcode,supplierId:s.id,supplierName:s.name,deliveryId:d.id,deliveryName:d.name});close();toast('Товар сохранен');await load();setTab('supplier',{supplierId:s.id})}
function csv(){const rows=[['Название','Категория','Закупка','Продажа','Штрихкод','Остаток','Размер','Пол','Поставщик','Завоз'],...state.products.map(p=>[p.name,p.cat,p.buy,p.sale,'="'+p.barcode+'"',p.qty,p.size,p.gender,p.supplierName,p.deliveryName])];download(new Blob(['\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}),'ixsayz.csv')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function printWin(html){const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400)}
function ean13Svg(code){
code=String(code||'').replace(/\D/g,'');
if(!/^\d{13}$/.test(code))return `<div class="barcode-text">${esc(code)}</div>`;
const L={0:'0001101',1:'0011001',2:'0010011',3:'0111101',4:'0100011',5:'0110001',6:'0101111',7:'0111011',8:'0110111',9:'0001011'};
const G={0:'0100111',1:'0110011',2:'0011011',3:'0100001',4:'0011101',5:'0111001',6:'0000101',7:'0010001',8:'0001001',9:'0010111'};
const R={0:'1110010',1:'1100110',2:'1101100',3:'1000010',4:'1011100',5:'1001110',6:'1010000',7:'1000100',8:'1001000',9:'1110100'};
const P={0:'LLLLLL',1:'LLGLGG',2:'LLGGLG',3:'LLGGGL',4:'LGLLGG',5:'LGGLLG',6:'LGGGLL',7:'LGLGLG',8:'LGLGGL',9:'LGGLGL'};
const d=code.split('').map(Number);
let bits='101';
for(let i=1;i<=6;i++)bits+=(P[d[0]][i-1]==='L'?L[d[i]]:G[d[i]]);
bits+='01010';
for(let i=7;i<=12;i++)bits+=R[d[i]];
bits+='101';
let bars='',x=0;
for(let i=0;i<bits.length;i++){
  if(bits[i]==='1')bars+=`<rect x="${x}" y="0" width="1" height="48"/>`;
  x++;
}
return `<svg class="barcode" viewBox="0 0 95 62" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><rect width="95" height="62" fill="#fff"/>${bars}<text x="47.5" y="60" text-anchor="middle" font-family="Arial" font-size="9" fill="#000">${code}</text></svg>`;
}
function printLabels(){
const html=`<html><head><style>
@page{size:43mm 25mm;margin:0}
body{margin:0;font-family:Arial;color:#000;background:#fff}
.label{width:43mm;height:25mm;page-break-after:always;padding:1.6mm 2mm;box-sizing:border-box;text-align:center;overflow:hidden}
.name{font-size:7.5pt;font-weight:bold;line-height:1.05;height:8mm;overflow:hidden}
.price{font-size:12pt;font-weight:bold;line-height:1.1;margin-top:.4mm}
.size{font-size:7.5pt;line-height:1.1;margin-top:.2mm}
.barcode{width:37mm;height:10.5mm;margin-top:.6mm;display:block;margin-left:auto;margin-right:auto}
.barcode-text{text-align:center;font-size:7pt;margin-top:2mm}
</style></head><body>${state.products.flatMap(p=>Array.from({length:+p.labelQty||+p.qty||1},()=>`<div class="label"><div class="name">${esc(p.name)}</div><div class="price">${p.sale} ₽</div><div class="size">Размер: ${esc(p.size)}</div>${ean13Svg(p.barcode)}</div>`)).join('')}</body></html>`;
printWin(html)
}
function printReport(){const html=`<html><body><h1>IXSAYZ Inventory</h1>${state.products.map(p=>`<div>${esc(p.name)} ${esc(p.size)} ${p.qty}шт ${p.sale}₽</div>`).join('')}</body></html>`;printWin(html)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)return setTab(b.dataset.tab);try{const a=b.dataset.act,i=b.dataset.id;if(a==='newDelivery')deliveryForm();if(a==='openDelivery')setTab('delivery',{deliveryId:i});if(a==='editDelivery'){const d=state.deliveries.find(x=>x.id===i);deliveryForm(d);setTimeout(()=>$('#fDelivery').dataset.id=i)}if(a==='delDelivery'&&confirm('Удалить завоз?')){for(const p of dp(i))await del('products',p.id);for(const s of ds(i))await del('suppliers',s.id);await del('deliveries',i);await load()}if(a==='newSupplier')supplierForm();if(a==='openSupplier')setTab('supplier',{supplierId:i});if(a==='editSupplier'){const s=state.suppliers.find(x=>x.id===i);supplierForm(s);setTimeout(()=>$('#fSupplier').dataset.id=i)}if(a==='delSupplier'&&confirm('Удалить поставщика?')){for(const p of sp(i))await del('products',p.id);await del('suppliers',i);await load()}if(a==='newProduct')productForm();if(a==='editProduct'){const p=state.products.find(x=>x.id===i);productForm(p);setTimeout(()=>$('#fProduct').dataset.id=i)}if(a==='delProduct'&&confirm('Удалить товар?')){await del('products',i);await load()}if(a==='csv')csv();if(a==='printLabels')printLabels();if(a==='printReport')printReport()}catch(err){toast(err.message);console.error(err)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Сохраняю...'}try{if(f.id==='fDelivery'){if(!f.name.value.trim())throw Error('Напиши название завоза');await saveDelivery(f)}if(f.id==='fSupplier'){if(!f.name.value.trim())throw Error('Напиши поставщика');await saveSupplier(f)}if(f.id==='fProduct'){if(!f.name.value.trim())throw Error('Напиши название товара');await saveProduct(f)}}catch(err){toast(err.message);console.error(err)}finally{if(btn){btn.disabled=false;btn.textContent='Сохранить'}}});
$('#close').onclick=close;$('#refresh').onclick=load;document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#authScreen')?.classList.add('hidden');$('#mainApp')?.classList.remove('hidden');render();load();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(console.error);}
})();
</script>
</body>
</html>
